<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مزهرية وسط - Betefor Malaki Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" media="print" onload="this.media='all'">
<style>
  :root{ --cream:#F3E3C3; --dim:rgba(255,255,255,0.78); }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Tajawal',sans-serif;background:#020617;color:#fff;min-height:100vh;padding-bottom:40px;}
  header{
    position:sticky;top:0;z-index:5;background:rgba(2,6,23,0.92);backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(255,255,255,0.1);padding:16px 20px;
    display:flex;align-items:center;justify-content:space-between;
  }
  header .title{font-family:'Amiri',serif;font-weight:700;font-size:1.2rem;color:var(--cream);}
  header .back{
    color:#fff;text-decoration:none;font-size:0.8rem;
    background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.3);
    padding:7px 14px;border-radius:999px;
  }
  main{padding:18px;max-width:460px;margin:0 auto;}
  .item{
    background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
    border-radius:14px;padding:8px;margin-bottom:16px;
  }
  .item img{width:100%;height:auto;border-radius:10px;display:block;margin-bottom:8px;}
  .order{
    display:flex;align-items:center;justify-content:center;gap:6px;
    background:#25D366;color:#fff;font-size:0.8rem;font-weight:700;
    padding:11px;border-radius:999px;text-decoration:none;
  }
  #loading{text-align:center;color:var(--dim);padding:40px 0;}
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">‹ رجوع</a>
  <span class="title">مزهرية وسط</span>
</header>

<main>
  <div id="loading">جاري التحميل...</div>
  <div id="items"></div>
</main>

<script>
  const SUPABASE_URL = 'https://iekotptltmkjmieauhqc.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_35u5V1apSr2-DCpjp8ltmg_gIJzhXEN';
  const CATEGORY = 'mid-vasa';
  const CATEGORY_AR = 'مزهرية وسط';
  let WA_NUMBER = '971504712215';

  function renderItems(data){
    document.getElementById('loading').style.display = 'none';
    const container = document.getElementById('items');
    if (!data || !data.length) {
      container.innerHTML = '<div id="loading">ما فيه صور بعد بهذا القسم</div>';
      return;
    }
    data.forEach(function(item, idx){
      const waMsg = encodeURIComponent('مرحباً، أرغب بطلب من قسم: ' + CATEGORY_AR + ' - صورة رقم ' + (idx + 1));
      const waLink = 'https://wa.me/' + WA_NUMBER + '?text=' + waMsg;
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML =
        '<img src="' + item.image_url + '" alt="" loading="lazy">' +
        '<a class="order" href="' + waLink + '" target="_blank">' +
        '<svg viewBox="0 0 24 24" width="14" height="14" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.8 14.2c-.3.7-1.4 1.3-1.9 1.3-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5.1-4.5-.1-.2-1.2-1.6-1.2-3.1s.8-2.2 1.1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .5-.1.7.5.3.7.9 2.2 1 2.4.1.2.1.3 0 .5-.1.2-.2.3-.3.5-.2.2-.3.3-.5.5-.2.2-.3.4-.1.7.2.3.9 1.4 1.9 2.3 1.3 1.1 2.4 1.5 2.7 1.6.3.1.5.1.7-.1.2-.2.8-.9 1-1.2.2-.3.4-.2.7-.1.3.1 1.8.8 2.1 1 .3.2.5.2.6.4.1.2.1.7-.2 1.3z"/></svg>' +
        'اطلب واتساب</a>';
      container.appendChild(div);
    });
  }

  (function(){
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/@supabase/supabase-js@2';
    s.onload = async function(){
      try {
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const settingsRes = await sb.from('site_settings').select('whatsapp_number').eq('id', 1).single();
        if (settingsRes.data && settingsRes.data.whatsapp_number) {
          WA_NUMBER = settingsRes.data.whatsapp_number;
        }
        const itemsRes = await sb.from('gallery_items').select('*').eq('category', CATEGORY).order('position', { ascending: true });
        renderItems(itemsRes.error ? null : itemsRes.data);
      } catch (e) {
        document.getElementById('loading').textContent = 'تعذر الاتصال بقاعدة البيانات';
      }
    };
    s.onerror = function(){
      document.getElementById('loading').textContent = 'تعذر تحميل مكتبة الاتصال، تحقق من الإنترنت';
    };
    document.head.appendChild(s);
  })();
</script>

</body>
</html>
