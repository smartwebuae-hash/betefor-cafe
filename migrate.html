<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقل الصور - مرة واحدة فقط</title>
<style>
  body{font-family:Tajawal,sans-serif;background:#020617;color:#fff;padding:24px;min-height:100vh;}
  h1{font-size:1.2rem;color:#F3E3C3;margin-bottom:20px;}
  .cat-row{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:14px;margin-bottom:10px;}
  .cat-name{font-weight:700;margin-bottom:6px;}
  .cat-status{font-size:0.8rem;color:#aaa;}
  .cat-status.ok{color:#8aff9e;}
  .cat-status.err{color:#ff8a8a;}
  .cat-status.working{color:#F3E3C3;}
  button{margin-top:20px;padding:14px 24px;border:none;border-radius:999px;background:#F3E3C3;color:#1a1a1a;font-weight:700;font-size:1rem;cursor:pointer;width:100%;}
  button:disabled{opacity:0.5;}
  #summary{margin-top:16px;font-size:0.85rem;color:#F3E3C3;}
</style>
</head>
<body>

<h1>نقل الصور لقاعدة البيانات (مرة واحدة فقط)</h1>
<div id="list"></div>
<button id="startBtn" onclick="startMigration()">ابدأ النقل</button>
<div id="summary"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://iekotptltmkjmieauhqc.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_35u5V1apSr2-DCpjp8ltmg_gIJzhXEN';
  let supabase = null;
  try {
    if (window.supabase) {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  } catch (e) {
    console.warn('Supabase init failed', e);
  }

  const CATEGORIES = [
    { slug:'kg1', file:'menu-kg1.html', count:61 },
    { slug:'half-kg', file:'menu-half-kg.html', count:31 },
    { slug:'mid-vasa', file:'menu-mid-vasa.html', count:33 },
    { slug:'small-vasa', file:'menu-small-vasa.html', count:34 },
    { slug:'long-vasa', file:'menu-long-vasa.html', count:31 },
    { slug:'big-vasa', file:'menu-big-vasa.html', count:28 },
    { slug:'big-acrylic', file:'menu-big-acrylic.html', count:21 },
    { slug:'small-acrylic', file:'menu-small-acrylic.html', count:19 },
    { slug:'elba', file:'menu-elba.html', count:24 },
    { slug:'mala', file:'menu-mala.html', count:16 },
    { slug:'senya', file:'menu-senya.html', count:11 },
  ];

  const listEl = document.getElementById('list');
  CATEGORIES.forEach(cat => {
    const row = document.createElement('div');
    row.className = 'cat-row';
    row.id = 'row-' + cat.slug;
    row.innerHTML = '<div class="cat-name">' + cat.slug + ' (' + cat.count + ' صورة)</div><div class="cat-status" id="status-' + cat.slug + '">بانتظار البدء...</div>';
    listEl.appendChild(row);
  });

  function setStatus(slug, text, cls){
    const el = document.getElementById('status-' + slug);
    el.textContent = text;
    el.className = 'cat-status ' + (cls || '');
  }

  function dataURItoBlob(dataURI){
    const parts = dataURI.split(',');
    const mime = parts[0].match(/:(.*?);/)[1];
    const binary = atob(parts[1]);
    const arr = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  async function migrateCategory(cat){
    setStatus(cat.slug, 'جاري التحميل...', 'working');
    const res = await fetch(cat.file);
    const html = await res.text();
    const regex = /data:image\/jpeg;base64,[A-Za-z0-9+\/=]+/g;
    const matches = html.match(regex) || [];
    setStatus(cat.slug, 'وجدت ' + matches.length + ' صورة، جاري الرفع...', 'working');

    let uploaded = 0;
    for (let i = 0; i < matches.length; i++) {
      const blob = dataURItoBlob(matches[i]);
      const path = cat.slug + '/img-' + (i + 1).toString().padStart(3, '0') + '.jpg';
      const { error: upErr } = await supabase.storage.from('gallery').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
      if (upErr) { setStatus(cat.slug, 'خطأ بالرفع: ' + upErr.message, 'err'); return; }
      const { data: urlData } = supabase.storage.from('gallery').getPublicUrl(path);
      const { error: insErr } = await supabase.from('gallery_items').insert([{ category: cat.slug, position: i + 1, image_url: urlData.publicUrl }]);
      if (insErr) { setStatus(cat.slug, 'خطأ بالحفظ: ' + insErr.message, 'err'); return; }
      uploaded++;
      setStatus(cat.slug, 'تم رفع ' + uploaded + ' من ' + matches.length, 'working');
    }
    setStatus(cat.slug, 'تم ✓ (' + uploaded + ' صورة)', 'ok');
  }

  function startMigration(){
    alert('الزر اشتغل! جاري المتابعة...');
    document.getElementById('summary').textContent = 'جاري التحقق من الاتصال...';
    if (!supabase) {
      document.getElementById('summary').textContent = 'تعذر الاتصال بقاعدة البيانات. تحقق من اتصال الإنترنت وأعد تحميل الصفحة، ثم حاول مرة أخرى.';
      return;
    }
    document.getElementById('startBtn').disabled = true;
    document.getElementById('summary').textContent = 'جاري النقل... لا تغلق الصفحة';
    runMigration();
  }

  async function runMigration(){
    for (const cat of CATEGORIES) {
      await migrateCategory(cat);
    }
    document.getElementById('summary').textContent = 'انتهى النقل بالكامل! تقدر تحذف هذا الملف الآن.';
  }
</script>

</body>
</html>
