<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار بسيط</title>
<style>
  body{font-family:sans-serif;background:#fff;color:#000;padding:40px;text-align:center;}
  button{padding:20px 40px;font-size:20px;background:#007AFF;color:#fff;border:none;border-radius:10px;}
  select{padding:15px;font-size:18px;margin-top:20px;width:100%;}
</style>
</head>
<body>

<h1>صفحة اختبار بسيطة</h1>
<button onclick="alert('اشتغل الزر بنجاح!')">اضغط هنا</button>

<br><br>

<select onchange="alert('اشتغلت القائمة! اخترت: ' + this.value)">
  <option value="">اختر...</option>
  <option value="a">خيار أ</option>
  <option value="b">خيار ب</option>
</select>

</body>
</html>
