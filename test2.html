<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار مكتبة خارجية</title>
<style>
  body{font-family:sans-serif;background:#fff;color:#000;padding:40px;text-align:center;}
  button{padding:20px 40px;font-size:20px;background:#007AFF;color:#fff;border:none;border-radius:10px;}
</style>
</head>
<body>

<h1>اختبار تحميل مكتبة خارجية</h1>
<p id="status" style="color:orange;">جاري تحميل المكتبة...</p>
<button onclick="alert('اشتغل الزر!')">اضغط هنا</button>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  document.getElementById('status').textContent = window.supabase ? 'المكتبة تحمّلت بنجاح ✓' : 'المكتبة ما تحمّلت ✗';
  document.getElementById('status').style.color = window.supabase ? 'green' : 'red';
</script>

</body>
</html>
